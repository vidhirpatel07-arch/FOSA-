<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=800" />
  <title>Event Ticket | Force One Defence Academy</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  
  <style>
    body {
      background-color: var(--color-background);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .ticket-container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 500px;
      overflow: hidden;
      position: relative;
    }
    /* Ticket notch effect */
    .ticket-container::before, .ticket-container::after {
      content: '';
      position: absolute;
      top: 150px;
      width: 40px;
      height: 40px;
      background-color: var(--color-background);
      border-radius: 50%;
      z-index: 10;
    }
    .ticket-container::before {
      left: -20px;
    }
    .ticket-container::after {
      right: -20px;
    }
    
    .ticket-header {
      background: var(--color-primary-charcoal);
      color: white;
      padding: 2.5rem 2rem 3rem 2rem;
      text-align: center;
      position: relative;
    }
    .ticket-header img {
      width: 60px;
      margin-bottom: 1rem;
      filter: brightness(0) invert(1);
    }
    .ticket-status {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      border: 2px solid #22c55e;
      color: #22c55e;
      font-weight: 700;
      padding: 0.3rem 0.8rem;
      border-radius: 4px;
      transform: rotate(15deg);
      font-family: var(--font-heading);
      letter-spacing: 1px;
    }
    .ticket-body {
      padding: 2.5rem 2rem;
      border-top: 2px dashed #e2e8f0;
      position: relative;
    }
    
    .ticket-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      gap: 1rem;
    }
    .ticket-col {
      flex: 1;
    }
    .ticket-label {
      font-size: 0.8rem;
      color: var(--color-secondary-taupe);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.3rem;
    }
    .ticket-value {
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--color-primary-charcoal);
    }
    .ticket-value.large {
      font-size: 1.3rem;
      font-family: var(--font-heading);
    }
    
    .barcode {
      margin-top: 2rem;
      text-align: center;
      padding-top: 2rem;
      border-top: 1px solid #e2e8f0;
    }
    .barcode img {
      height: 60px;
      width: 80%;
      object-fit: cover;
      opacity: 0.8;
    }
    .barcode p {
      font-family: monospace;
      margin-top: 0.5rem;
      color: #64748b;
      letter-spacing: 2px;
    }
    
    /* Loader */
    #loader {
      text-align: center;
      padding: 4rem;
    }
    #error-state {
      text-align: center;
      padding: 4rem;
      color: red;
      display: none;
    }
    
    .btn-close-receipt {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      width: 44px;
      height: 44px;
      background: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      color: var(--color-primary-charcoal);
      z-index: 100;
      transition: transform 0.3s ease;
    }
    .btn-close-receipt:hover {
      transform: scale(1.1);
    }
  </style>
  <link rel="icon" href="/images/logo.png" type="image/png">
  <script type="module" crossorigin src="/assets/receipt-DUeSXtcI.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/store-DDWtH5Ds.js">
  <link rel="stylesheet" crossorigin href="/assets/style-D8XVh80g.css">
</head>
<body>

  <a href="/" class="btn-close-receipt" aria-label="Back to home">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
  </a>

  <div id="loader">
    <div class="spinner" style="margin: 0 auto; border-top-color: var(--color-primary-charcoal);"></div>
    <p class="mt-md">Loading Ticket...</p>
  </div>
  
  <div id="error-state">
    <h2>Ticket Not Found</h2>
    <p class="mt-sm">This booking ID is invalid or does not exist.</p>
    <a href="/" class="btn btn-primary mt-md">Return Home</a>
  </div>

  <div class="ticket-container" id="ticket-card" style="display: none; animation: fadeIn 0.5s ease forwards;">
    <div class="ticket-header">
      <img src="/images/logo.png" alt="Logo">
      <h2 style="font-family: var(--font-heading); margin-bottom: 0.5rem;" id="t-event-name">Event Name</h2>
      <p style="color: #cbd5e1; font-size: 0.9rem;" id="t-session-name">Session Name</p>
      <div class="ticket-status" id="t-status">CONFIRMED</div>
    </div>
    
    <div class="ticket-body">
      <div class="ticket-row">
        <div class="ticket-col">
          <div class="ticket-label">Date</div>
          <div class="ticket-value" id="t-date">--</div>
        </div>
        <div class="ticket-col" style="text-align: right;">
          <div class="ticket-label">Time</div>
          <div class="ticket-value" id="t-time">--</div>
        </div>
      </div>
      
      <div class="ticket-row">
        <div class="ticket-col">
          <div class="ticket-label">Location</div>
          <div class="ticket-value" id="t-location">--</div>
        </div>
      </div>
      
      <div style="margin: 2rem 0; height: 1px; background: #e2e8f0;"></div>
      
      <div class="ticket-row">
        <div class="ticket-col">
          <div class="ticket-label">Primary Guest</div>
          <div class="ticket-value large" id="t-name">--</div>
          <div style="font-size: 0.85rem; color: #64748b; margin-top: 0.2rem;" id="t-contact">--</div>
        </div>
        <div class="ticket-col" style="text-align: right;">
          <div class="ticket-label">Total Guests</div>
          <div class="ticket-value large" id="t-pax">--</div>
        </div>
      </div>
      
      <div id="t-additional" style="display: none; background: #f8fafc; padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; font-size: 0.85rem;">
        <strong style="display: block; margin-bottom: 0.5rem;">Additional Participants:</strong>
        <ul id="t-add-list" style="margin: 0; padding-left: 1rem; color: var(--color-primary-charcoal);"></ul>
      </div>
      
      <div class="ticket-row" style="margin-bottom: 0;">
        <div class="ticket-col">
          <div class="ticket-label">Total Paid</div>
          <div class="ticket-value" style="font-weight: 700; color: #16a34a;" id="t-amount">--</div>
        </div>
      </div>
      
      <div class="barcode">
        <img id="t-qrcode" src="" alt="Official QR Code" style="width: 120px; height: 120px; margin: 0 auto; display: none;" />
        <p id="t-booking-id" style="font-weight: 600; margin-top: 1rem;">--</p>
        <p style="font-size: 0.75rem; color: #16a34a; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 4px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
          Verified Official Ticket
        </p>
      </div>
      
    </div>
  </div>

</body>
</html>
